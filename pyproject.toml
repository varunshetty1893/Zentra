[project]
name = "zentra"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.1",
    "Flask-Migrate==4.0.7",
    "Flask-Limiter==4.1.1",
    "Flask-Mail==0.10.0",
    "WTForms==3.1.2",
    "email-validator==2.2.0",
    "Werkzeug==3.0.3",
    "Jinja2>=3.1.5",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.9",
    "limits==5.8.0",
    "scikit-learn==1.5.1",
    "pandas==2.2.2",
    "reportlab==4.2.2",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "Authlib==1.3.1"
]

[tool.vercel]
entrypoint = "run:app"